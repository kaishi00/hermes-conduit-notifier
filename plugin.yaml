name: conduit_push
manifest_version: 1
version: 0.170.6
description: "Send Hermes lifecycle notifications to Conduit devices."
author: Hermes Conduit
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - subagent_start
  - subagent_stop
  - pre_llm_call
  - post_approval_response
  - pre_api_request
  - post_api_request
  - transform_tool_result
  - transform_llm_output
provides_tools:
  - conduit_call_user
  - conduit_call_watch
  - conduit_watch_report
  - conduit_settings
  - conduit_present
  - conduit_show
  - conduit_notify
  - conduit_health
  - conduit_inbox
  - conduit_location
  - conduit_maps
  - conduit_calendar
  - conduit_phone
  - conduit_photos
  - conduit_contacts
  - conduit_room
  - conduit_ask_owner
  - conduit_free_busy
  - conduit_ask_linked
  - work_list
  - work_start
  - work_send
  - work_stop
  - work_read
  - work_close
  - work_ask
  - work_reply
  - work_tell
  - work_note
  - work_propose
  - work_progress
  - conduit_room_work
provides_middleware:
  - tool_execution
config_schema:
  cleanup_disbanded_rooms:
    type: str
    choices: [delete, "off"]
    default: delete
    label: Disbanded rooms' hidden chats
    description: >-
      delete removes this host's agents' hidden sessions for a group room once
      it's disbanded; off keeps them, as Hermes alone would. Read from the root
      profile.
  conduit_rooms_only:
    type: bool
    default: false
    label: Only Conduit's rooms
    description: >-
      On keeps the plugin's room changes (the memory guard, the owner rules for
      rooms with other people's agents, and the disband cleanup) to rooms
      Conduit made, for a Hermes others use group rooms on too. Read from the
      root profile.
