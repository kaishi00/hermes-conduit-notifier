name: conduit_push
manifest_version: 1
version: 0.51.5
description: "Send Hermes lifecycle notifications to Conduit devices."
author: Hermes Conduit
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_hooks:
  - pre_tool_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - subagent_start
  - subagent_stop
  - pre_llm_call
  - post_approval_response
  - pre_api_request
  - post_api_request
provides_tools:
  - conduit_call_user
  - conduit_call_watch
  - conduit_watch_report
  - conduit_settings
  - conduit_present
  - conduit_show
  - conduit_health
  - conduit_location
  - conduit_maps
  - conduit_calendar
  - conduit_phone
  - conduit_contacts
provides_middleware:
  - tool_execution
