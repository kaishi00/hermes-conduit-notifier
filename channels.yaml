# Which plugin version Conduit's App Store builds ask users to update to.
#
# TestFlight builds ask for every version on main (plugin.yaml). App Store
# builds only show the update notice when a host is below the plugin version
# on main when that Conduit build was archived (Conduit records it at archive
# time), so a plugin merge between App Store releases doesn't nag everyone.
# `stable` can raise that between builds, never lower it: raise it when App
# Store users need a plugin fix before the next Conduit release.
# Tapping Update still installs main. Users can switch in Conduit under
# Settings > Conduit plugin > Update notices.
#
# Must be a dotted number no newer than plugin.yaml's version
# (tests/test_channels.py).
stable: 0.122.4
