# The contract between this plugin and Hermes Agent, for the upstream watch
# (.github/workflows/upstream-contract.yml). The part above the generated
# marker is kept by hand; the part below comes from the code
# (upstream/contract.py) and CI fails when it is stale.

# Upstream paths watched besides the modules the plugin imports (module_paths
# below): the dashboard and plugin host that serve our routes, profiles and
# auth, the state schema, and the docs that describe the plugin API. A
# trailing / is a directory; * matches within one path segment.
watch_paths:
  - hermes_cli/web_server*.py
  - hermes_cli/web_routers/
  - hermes_cli/plugins*.py
  - hermes_cli/profiles*.py
  - hermes_cli/dashboard_auth/
  - hermes_cli/config*.py
  - hermes_state_schema.py
  - gateway/hosted_room*.py
  - website/docs/user-guide/features/plugins.md
  - website/docs/user-guide/features/extending-the-dashboard.md

# Words that make a changed hunk worth a closer look.
keywords: [websocket, profile, plugin_api, isolation, consent, refused, ticket, session_token, x-hermes,
           HERMES_PLUGIN_HOST_PROCESS]

# What each integration point feeds in Conduit, for whoever reads an alert.
# Feature map entries are in hermes-conduit docs/FEATURE_MAP.md.
notes:
  plugin sockets on a secondary profile: >-
    Local Live, the speech server, Grok Live and Watch audio (feature map: "Voice on a profile the
    dashboard didn't start with"). Hermes 0.22.3+ refuses them on ?profile=; Conduit sends
    ?conduit_profile= instead.
  plugin consent per profile: >-
    _plugin_api_request_refused gates ?conduit_profile= the way Hermes gates ?profile=.
  Linked Rooms on a secondary profile: >-
    New drafts and the host setup (feature map: "Linked Rooms") take ?conduit_profile=: a draft
    starts in the dashboard's session authority, which a plugin host's app lacks (there it starts
    in the legacy service), and the setup restarts the gateway as the dashboard does.
  plugin host flag: >-
    HERMES_PLUGIN_HOST_PROCESS=1 marks a plugin host. The self-update refuses there, and the
    Linked Rooms setup saves without restarting the gateway: a restart from a plugin host brings
    the gateway back with the host's environment, this flag among it.
  dashboard websocket auth: >-
    hermes_cli.web_server_chat._ws_auth_ok and _ws_request_is_allowed sign in every plugin socket;
    without them the sockets fail closed.
  Linked Rooms approvals: >-
    Your agents' approvals in rooms other people host (feature map: "Linked Rooms"): read with the
    run's own grant (GET /v1/runs/{id}) and answered with an approve-only grant of its scope
    (POST /v1/runs/{id}/approval) on this Hermes' API server, and matched to their notification by
    sessions.session_key in the profile's state.db.
  Linked Rooms copies: >-
    Copies of rooms other people host (feature map: "Linked Rooms"). The home pages its room log
    with gateway.hosted_rooms.read_events, and each member's Hermes keeps the copy with
    gateway.hosted_room_replicas.ingest_page (its ReplicaError refusals answered with what the copy
    holds), both loaded with importlib, so module_paths doesn't list them. Without them, no pages
    go and no copies are kept, with one log line.
  Linked Rooms posts: >-
    Posting in rooms other people host (feature map: "Linked Rooms"). The home names each post's
    event with gateway.hosted_rooms.user_event_id (loaded with importlib) and posts it with the
    running room service's HostedRoomService.send(room_id=, event_id=, payload={thread_id, text}),
    as the room's user. Without them, every post is answered unavailable.
  workspace files: >-
    The Folder tab in Conduit's Artifacts (feature map: "Workspace files"). /workspace/* reads a
    profile's SSH workspace through hermes_cli.web_routers.files._fs_backend (and the adapter's
    _normalize and _execute), maps a Docker profile's container paths with
    hermes_cli.web_server_files._agent_fs_path, keeps a locked or hosted install's roots inside
    the folder _managed_files_policy names, and keeps out what _is_sensitive_path keeps out of
    Hermes' own file routes.

# Upstream behaviors we know are broken, keyed by test and failure signature.
# A listed test xfails while it fails with this signature, and fails when it
# passes (upstream fixed it: review the workaround) or fails differently.
known_failures:
  - test: test_upstream_profile_socket_reaches_profile
    signature: HTTP 501
    issue: kaishi00/hermes-conduit#1336
    upstream: NousResearch/hermes-agent#140051
    since: v0.22.3 (da01ee9c3)
    workaround: ?conduit_profile= on the dashboard-process routes (notifier #412)

