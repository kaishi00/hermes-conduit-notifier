# Hermes modules and names the plugin imports. Optional ones are imported inside a try.
imports:
  agent:
    optional: ["background_review"]
  agent.auxiliary_client:
    optional: ["scoped_runtime_main"]
  agent.background_review:
    optional: ["_digest_history", "_record_review_usage_to_parent", "_snapshot_review_usage", "build_cache_parity_fork"]
  agent.delegation_context:
    optional: ["is_delegated_child_context"]
  agent.memory_manager:
    required: ["MemoryManager"]
  agent.memory_provider:
    optional: ["is_core_memory_provider"]
  agent.oneshot:
    optional: ["run_oneshot"]
  agent.prompt_builder:
    required: ["load_soul_md"]
  agent.redact:
    optional: ["redact_sensitive_text"]
  agent.side_question:
    optional: ["_FORK_PROMPT", "answer_side_question", "trim_snapshot_for_fork"]
  agent.web_search_registry:
    optional: ["get_active_search_provider"]
  cron:
    optional: ["jobs"]
  cron.jobs:
    optional: ["trigger_job"]
  gateway.config:
    optional: ["Platform"]
  gateway.platforms.base:
    optional: ["BasePlatformAdapter"]
  gateway.response_filters:
    optional: ["is_autonomous_silence_response"]
  hermes_cli:
    optional: ["active_sessions", "lifecycle"]
  hermes_cli._launchers:
    optional: ["runtime_command"]
  hermes_cli.active_sessions:
    optional: ["_own_start_time"]
  hermes_cli.anon_auth:
    optional: ["on_local_desktop_backend"]
  hermes_cli.auth_codex:
    optional: ["resolve_codex_runtime_credentials"]
  hermes_cli.auth_constants:
    optional: ["AuthError", "_decode_jwt_claims"]
  hermes_cli.config:
    required: ["load_config"]
    optional: ["get_env_value", "get_project_root"]
  hermes_cli.config_effective:
    required: ["load_user_config_effective"]
  hermes_cli.dashboard_auth:
    optional: ["registry", "token_auth"]
  hermes_cli.dashboard_auth.base:
    required: ["DashboardAuthProvider", "TokenPrincipal"]
  hermes_cli.gateway_runtime_start:
    optional: ["start_detached_replacement"]
  hermes_cli.plugins:
    required: ["invoke_hook"]
    optional: ["clear_thread_tool_whitelist", "set_thread_tool_whitelist"]
  hermes_cli.profiles:
    optional: ["get_active_profile_name", "get_profile_dir", "list_profile_names"]
  hermes_cli.tools_config:
    optional: ["_get_platform_tools", "_get_plugin_toolset_keys"]
  hermes_cli.web_routers:
    optional: ["sessions"]
  hermes_cli.web_routers.files:
    optional: ["_fs_backend", "_fs_profile_home", "_is_sensitive_path"]
  hermes_cli.web_server_chat:
    optional: ["_ws_auth_ok", "_ws_request_is_allowed"]
  hermes_cli.web_server_dashboard:
    optional: ["_plugin_api_request_refused"]
  hermes_cli.web_server_files:
    optional: ["_agent_fs_path", "_managed_files_policy"]
  hermes_cli.web_server_profiles:
    optional: ["_config_profile_scope"]
  hermes_constants:
    required: ["*", "get_hermes_home"]
    optional: ["get_default_hermes_root"]
  hermes_state:
    required: ["SessionDB"]
  hermes_state_ids:
    optional: ["new_session_id"]
  hermes_time:
    optional: ["now"]
  hermes_yaml:
    optional: ["*"]
  plugins.memory:
    required: ["load_memory_provider"]
  tools:
    optional: ["voice_live"]
  tools.approval:
    required: ["list_gateway_approvals", "resolve_gateway_approval"]
    optional: ["_get_approval_timeout"]
  tools.approval_context:
    optional: ["_get_approval_timeout"]
  tools.clarify_gateway:
    optional: ["get_clarify_timeout"]
  tools.clarify_tool:
    required: ["strip_recommended"]
    optional: ["_normalize_questions", "_result"]
  tools.cronjob_tools:
    optional: ["cronjob"]
  tools.memory_tool:
    required: ["MemoryStore", "get_builtin_memory_config", "get_builtin_memory_store_flags", "get_memory_dir"]
  tools.tool_backend_helpers:
    optional: ["*"]
  tools.voice_live:
    optional: ["LIVE_PERSONA", "VOICE_LIVE_TURN_NOTE"]
  tools.web_tools:
    required: ["web_search_tool"]
    optional: ["check_web_api_key"]
  tools.xai_http:
    optional: ["resolve_xai_http_credentials"]
  tui_gateway:
    optional: ["turn_marker"]

