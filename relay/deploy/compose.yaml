name: hermes-conduit-push

services:
  conduit-push:
    build:
      context: ..
    container_name: conduit-push
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 9120
      PUBLIC_URL: ${PUBLIC_URL}
      DATA_PATH: /var/lib/conduit-push/relay.json
      APNS_KEY_PATH: /run/secrets/apns-production.p8
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_TOPIC: ${APNS_TOPIC}
      TRUST_PROXY: 1
      RELAY_MAX_INSTALLATIONS: ${RELAY_MAX_INSTALLATIONS:-}
      RELAY_MAX_GATEWAYS_PER_INSTALLATION: ${RELAY_MAX_GATEWAYS_PER_INSTALLATION:-}
      RELAY_MAX_EVENT_IDS_PER_INSTALLATION: ${RELAY_MAX_EVENT_IDS_PER_INSTALLATION:-}
      RELAY_MAX_EVENT_IDS: ${RELAY_MAX_EVENT_IDS:-}
      RELAY_MAX_ACTIVE_DECISIONS: ${RELAY_MAX_ACTIVE_DECISIONS:-}
      RELAY_MAX_RETAINED_DECISIONS: ${RELAY_MAX_RETAINED_DECISIONS:-}
      RELAY_REGISTRATIONS_PER_MINUTE: ${RELAY_REGISTRATIONS_PER_MINUTE:-}
      RELAY_EVENTS_PER_MINUTE: ${RELAY_EVENTS_PER_MINUTE:-}
      RELAY_DEVICE_CHANGES_PER_MINUTE: ${RELAY_DEVICE_CHANGES_PER_MINUTE:-}
      RELAY_DECISION_ACTIONS_PER_MINUTE: ${RELAY_DECISION_ACTIONS_PER_MINUTE:-}
      RELAY_REVOCATIONS_PER_MINUTE: ${RELAY_REVOCATIONS_PER_MINUTE:-}
      RELAY_MAX_WATCH_GRANTS: ${RELAY_MAX_WATCH_GRANTS:-}
      RELAY_MAX_WATCH_GRANTS_PER_GATEWAY: ${RELAY_MAX_WATCH_GRANTS_PER_GATEWAY:-}
      RELAY_WATCH_CALLS_PER_MINUTE: ${RELAY_WATCH_CALLS_PER_MINUTE:-}
    volumes:
      - ./data:/var/lib/conduit-push
      - ./secrets/apns-production.p8:/run/secrets/apns-production.p8:ro
    networks:
      - pangolin
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9120/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  pangolin:
    external: true
