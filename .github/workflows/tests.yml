name: Tests

# The plugin, relay and mailbox test suites, on every PR and every push to
# main. Until 2026-10-23 they ran only when a session remembered to, so a PR
# could merge with a failing test, or with a plugin version another PR had
# already taken on main (two PRs shipped 0.51.5, two 0.62.4).

# The plugin tests run in parallel (pytest-xdist; worksteal, so one slow file
# doesn't hold a worker while the others idle). The Pulse persona suite
# (tests/test_pulse_personas.py, about 8 minutes of simulations) runs in its
# own job: daily, on demand, and on a PR or push that changes Pulse
# (Eric, 2026-11-02).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    # The daily run is the persona suite's alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - uses: actions/setup-node@v5
        with:
          # The mailbox client's tests run the mailbox itself, which needs
          # Node 22.13 or later; without it they skip.
          node-version: "22"

      - name: Install the test dependencies
        # Hermes provides these at runtime. aiortc and av stay out, so their
        # tests skip, as they do in a cloud session.
        run: python -m pip install -r tests/requirements.txt

      - name: Plugin version is free and in the changelog
        # A pull_request run tests the PR merged into main, so a version main
        # already has shows up here as a second CHANGELOG.md entry for it.
        run: python -m pytest --rootdir=tests tests/test_changelog.py -q

      - name: Run the plugin tests
        run: >-
          python -m pytest --rootdir=tests tests -q
          -n auto --dist worksteal
          --ignore=tests/test_pulse_personas.py

  personas:
    name: Pulse personas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # A pull_request checkout is the merge commit: HEAD^1 is the base.
          # A push to main is one squash merge: HEAD^1 is main before it.
          fetch-depth: 2

      - name: Does the change touch Pulse
        # Any pulse*.py, a Pulse test, the shared fixtures, the test
        # requirements or this workflow. Fails closed: a diff it can't read
        # runs the suite. A change elsewhere that breaks it shows up in the
        # daily run.
        id: pulse
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            if changed=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD) && [ -n "$changed" ] \
              && ! printf '%s\n' "$changed" \
                | grep -E '(^|/)pulse[^/]*\.py$|^tests/test_pulse[^/]*\.py$|^tests/conftest\.py$|^tests/requirements\.txt$|^\.github/workflows/tests\.yml$' >/dev/null; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "- persona suite: \`$run\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        if: steps.pulse.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the test dependencies
        if: steps.pulse.outputs.run == 'true'
        run: python -m pip install -r tests/requirements.txt

      - name: Run the persona suite
        if: steps.pulse.outputs.run == 'true'
        run: >-
          python -m pytest --rootdir=tests tests/test_pulse_personas.py -q
          -n auto --dist worksteal

  relay:
    name: Relay
    # The daily run is the persona suite's alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No dependencies to install: the relay uses Node's own modules only.
      - name: Run the relay tests
        run: npm test

  mailbox:
    name: Mailbox
    # The daily run is the persona suite's alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mailbox
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs 22.13 or later; "22" is the newest 22.x.
          node-version: "22"

      - name: Run the mailbox tests
        run: npm test
