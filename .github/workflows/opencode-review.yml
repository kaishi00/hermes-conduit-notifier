name: opencode-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Debounce (wait for rapid commits to settle)
        if: github.event_name == 'pull_request_target'
        run: sleep 60
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install opencode
        run: |
          if [ ! -d "$HOME/.opencode/bin" ]; then
            curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode review
        run: GITHUB_EVENT_NAME=pull_request GITHUB_ACTOR=${{ github.repository_owner }} opencode github run
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          MODEL: go-custom/deepseek-v4-flash
          USE_GITHUB_TOKEN: "true"
          PROMPT: |
            You are a code reviewer. DO NOT modify any files. DO NOT make commits.
            DO NOT run builds or tests.

            Output a structured code review as your final message. Use this format:

            ## Summary
            (1-2 sentences on what this PR does)

            ## Findings
            For each issue found, write:
            ### [severity: critical/major/minor/nit] Title
            **File:** path:line
            **Issue:** What's wrong
            **Suggestion:** How to fix it

            ## Verdict
            APPROVE / REQUEST_CHANGES / COMMENT

            Focus areas:
            - Python: type safety, exception handling, mutable default arguments,
              async/await correctness, injection vulnerabilities in string handling
            - JavaScript/Node.js: prototype pollution, unhandled promise rejections,
              resource leaks (connections, file handles), event listener cleanup,
              crypto misuse
            - Security: credential handling, input validation, injection vectors,
              rate-limiting bypass, timing attacks
            - HTTP: missing auth checks, open redirects, header injection,
              request body limits, CORS issues
            - Docker: least-privilege user, read-only filesystem, secret exposure
              in layers or environment
            - General: error messages leaking internals, missing rate limits,
              race conditions in shared state

            If you find no issues, say so explicitly. Do NOT summarize what you did
            or describe your process. Output only the review.
