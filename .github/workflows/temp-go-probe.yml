name: temp-go-probe
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install opencode
        run: |
          curl -fsSL https://raw.githubusercontent.com/anomalyco/opencode/v1.18.34/install -o /tmp/i.sh
          GITHUB_ACTIONS=false bash /tmp/i.sh --version 1.18.34 --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Built-in opencode provider, no key
        continue-on-error: true
        working-directory: /tmp
        run: timeout 180 opencode run -m opencode/crouton-alpha-free "Reply with the word ok." --print-logs 2>&1 | grep -v -i "authorization" | tail -40
      - name: Built-in opencode provider, Go key
        continue-on-error: true
        working-directory: /tmp
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: timeout 180 opencode run -m opencode/crouton-alpha-free "Reply with the word ok." --print-logs 2>&1 | grep -v -i "authorization" | tail -40
      - name: Go endpoint free models (curl)
        env:
          KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          for m in beam-free iceman-contributor-free; do
            echo "== go $m"
            curl -sS -m 90 https://opencode.ai/zen/go/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "x-opencode-session: probe-$GITHUB_RUN_ID" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the word ok.\"}],\"max_tokens\":300}" | head -c 800; echo
          done
